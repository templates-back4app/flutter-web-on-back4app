# Stack: nginx 1.27 | File: nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter routes are client-side: anything not on disk falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached, or a deploy ships and nobody sees it.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Hashed build output can be cached hard.
  location ~* \.(js|wasm|json|png|svg|ttf|otf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
